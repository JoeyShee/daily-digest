<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{DATE}} · {{SECTION_TITLE}}</title>
<link rel="stylesheet" href="{{CSS_PATH}}">
</head>
<body>
<nav class="top-nav">
  <a href="{{INDEX_PATH}}" class="brand">📋 每日精选</a>
  <div class="nav-links">
    <a href="{{PREV_DAY}}">← 前一天</a>
    <a href="{{NEXT_DAY}}">后一天 →</a>
  </div>
</nav>
<div class="container">
  <div class="day-nav">
    <a href="{{PREV_DAY}}">← 前一天</a>
    <div class="day-title">{{DATE}}</div>
    <a href="{{NEXT_DAY}}">后一天 →</a>
  </div>
  {{CARDS}}
  <footer class="site-footer">
    <p>Daily Digest · 纯粹的阅读体验</p>
  </footer>
</div>
<script>
var cards=document.querySelectorAll(".card");cards.forEach(function(c,i){if(i>0)c.classList.add("collapsed")});
document.addEventListener('click',function(e){var h=e.target.closest('.card-header');if(h)h.closest('.card').classList.toggle('collapsed')});
</script>
</body>
</html>
