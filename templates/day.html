<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{DATE}} · {{SECTION_TITLE}}</title>
<link rel="stylesheet" href="{{CSS_PATH}}">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<nav class="top-nav">
  <a href="{{INDEX_PATH}}" class="brand">商业感知</a>
  {{TAB_NAV}}
</nav>
<div class="container">
  <div class="day-nav">
    <a href="{{PREV_DAY}}" class="nav-btn">← 前一天</a>
    <div class="day-title">{{DATE}}</div>
    <a href="{{NEXT_DAY}}" class="nav-btn">后一天 →</a>
  </div>
  {{CARDS}}
  <footer class="site-footer">
    <p>Daily Digest · 先形成判断，再占用注意力</p>
  </footer>
</div>
<script>
var cards=document.querySelectorAll(".card");cards.forEach(function(c,i){if(i>0)c.classList.add("collapsed")});
document.addEventListener('click',function(e){var h=e.target.closest('.card-header');if(h)h.closest('.card').classList.toggle('collapsed')});
</script>
</body>
</html>
