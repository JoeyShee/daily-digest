<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>每日精选</title>

<body>
<nav class="top-nav">

    <a href="graveyard/" class="channel-card">
      <div class="channel-icon">🪦</div>
      <div class="channel-info">
        <div class="channel-name">想法墓地</div>
        <div class="channel-desc">困惑 · Idea · 选题 · 反思</div>
      </div>
