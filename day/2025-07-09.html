  <!-- 纯 JS: 卡片展开/收起 -->
  <script>
    document.addEventListener('click', function (e) {
      var header = e.target.closest('.card-header');
      if (!header) return;
      var card = header.closest('.card');
      if (!card) return;
      card.classList.toggle('collapsed');
    });
  </script>
